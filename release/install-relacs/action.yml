name: Install relacs CLI
description: Download relacs CLI from GitHub releases to ~/.local/bin

inputs:
  token:
    description: "GitHub token to use for authentication"
    required: true
  version:
    description: "Release version tag to install (e.g. v0.4.2). Omit to install the latest release."
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Download and install relacs
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail

        # Download installer to temp file
        INSTALLER="$(mktemp)"

        gh api \
          -H "Accept: application/vnd.github.v3.raw" \
          "/repos/stackrox/relacs/contents/scripts/install-relacs.sh" \
          > "${INSTALLER}"

        # Execute installer with version from environment
        bash "${INSTALLER}" "${VERSION}"
